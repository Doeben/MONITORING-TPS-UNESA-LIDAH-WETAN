name: Auto Fetch Monacolisa Telemetry Data

on:
  # 1. Jalan otomatis saat kamu edit / push file baru ke branch main
  push:
    branches:
      - main

  # 2. Jalan otomatis setiap 15 menit
  schedule:
    - cron: '*/15 * * * *'

  # 3. Tombol manual "Run workflow" di tab Actions
  workflow_dispatch:

# Izin akses untuk commit & push data.json
permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Fetch Script
        env:
          MONACOLISA_API_URL: ${{ secrets.MONACOLISA_API_URL }}
        run: python fetch_data.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Auto-update telemetry data.json [skip ci]" || exit 0
          git push
