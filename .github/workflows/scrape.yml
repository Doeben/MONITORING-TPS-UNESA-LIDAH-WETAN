name: Auto Fetch Monacolisa Telemetry Data

on:
  # 1. Jalan otomatis setiap kali kamu edit / push file ke branch main (termasuk jika kamu ganti index/script)
  push:
    branches:
      - main

  # 2. Jalan otomatis berdasarkan jadwal waktu (cron)
  schedule:
    # Jalankan otomatis setiap 15 menit
    - cron: '*/5 * * * *'

  # 3. Tombol manual "Run workflow" di tab Actions tetap tersedia
  workflow_dispatch:

# PENTING: Memberikan izin akses agar GitHub Actions bisa melakukan 'git push' pembaruan data.json
permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Environment Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. Jalankan Script Python dengan Secret URL Rahasia
      - name: Run Fetch Script
        env:
          MONACOLISA_API_URL: ${{ secrets.MONACOLISA_API_URL }}
        run: python fetch_data.py

      # 4. Commit dan Push file data.json yang baru diperbarui
      - name: Commit and Push Updated Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Auto-update telemetry data.json [skip ci]" || exit 0
          git push
