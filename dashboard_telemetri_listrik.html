    <style>
        /* Ensuring smooth transitions for hover effects */
        tbody tr {

<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen">

                    </span>
                    <span class="inline-flex items-center">
                        <svg class="mr-1.5 h-4 w-4 flex-shrink-0 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path></svg>

            </div>
            
            <div class="mt-4 md:mt-0 flex gap-2">
                <span class="inline-flex items-center rounded-md bg-green-50 px-2.5 py-1 text-xs font-medium text-green-700 ring-1 ring-inset ring-green-600/20">
                    Status: Active
                </span>
                <span id="record-count" class="inline-flex items-center rounded-md bg-blue-50 px-2.5 py-1 text-xs font-medium text-blue-700 ring-1 ring-inset ring-blue-700/10">
                    0 Records

            </div>
        </div>

        <!-- Data Table Card -->
        <div class="bg-white rounded-xl shadow-sm ring-1 ring-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200">
                    <thead class="bg-slate-50">
                        <tr>
                            <th scope="col" class="py-3.5 pl-4 pr-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider sm:pl-6">Waktu</th>
                            <th scope="col" class="px-3 py-3.5 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Meter ID</th>
                            <th scope="col" class="px-3 py-3.5 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Voltage V <span class="text-slate-400 font-normal lowercase">(A/B/C)</span></th>
                            <th scope="col" class="px-3 py-3.5 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Current A <span class="text-slate-400 font-normal lowercase">(A/B/C)</span></th>
                            <th scope="col" class="px-3 py-3.5 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Freq <span class="text-slate-400 font-normal lowercase">(Hz)</span></th>
                            <th scope="col" class="px-3 py-3.5 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">PF Total</th>
                            <th scope="col" class="px-3 py-3.5 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Active Pwr Total</th>
                        </tr>
                    </thead>
                    <tbody id="telemetry-table-body" class="divide-y divide-slate-200 bg-white">
                        <!-- Rows will be injected here via JavaScript -->

                </table>
            </div>
        </div>
    </div>

        /**
         * Parses a timestamp string like '20260922235431' into a readable format 'YYYY-MM-DD HH:mm:ss'
         */
        function parseTimestamp(ts) {
            if (!ts || ts.length !== 14) return ts;
            const year = ts.substring(0, 4);
            const month = ts.substring(4, 6);
            const day = ts.substring(6, 8);
            const hour = ts.substring(8, 10);
            const minute = ts.substring(10, 12);
            const second = ts.substring(12, 14);
            
            return `${year}-${month}-${day} ${hour}:${minute}:${second}`;
        }

        // Initialize Application
        function initDashboard() {
            // Set header info
            document.getElementById('filter-date').textContent = apiResponse.pagination.filter.tanggal;
            document.getElementById('filter-device').textContent = apiResponse.pagination.filter.device_imei;
            document.getElementById('record-count').textContent = `${apiResponse.data.length} Records Shown`;

            const tbody = document.getElementById('telemetry-table-body');
            
            // Generate rows
            apiResponse.data.forEach(item => {
                const measure = item.measurement;
                
                // Format combined values
                const voltageStr = `${measure.voltage_v.a} / ${measure.voltage_v.b} / ${measure.voltage_v.c}`;
                const currentStr = `${measure.current_a.a} / ${measure.current_a.b} / ${measure.current_a.c}`;
                const timeStr = parseTimestamp(item.timestamp);
                
                // Create table row
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-100/70 transition-colors';
                
                tr.innerHTML = `
                    <td class="whitespace-nowrap py-4 pl-4 pr-3 text-sm font-medium text-slate-900 sm:pl-6">
                        ${timeStr}
                    </td>
                    <td class="whitespace-nowrap px-3 py-4 text-sm text-slate-600 font-mono">
                        ${item.meter_id}
                    </td>
                    <td class="whitespace-nowrap px-3 py-4 text-sm text-slate-600">
                        ${voltageStr}
                    </td>
                    <td class="whitespace-nowrap px-3 py-4 text-sm text-slate-600">
                        ${currentStr}
                    </td>
                    <td class="whitespace-nowrap px-3 py-4 text-sm text-slate-600">
                        ${measure.frequency_hz.toFixed(2)}
                    </td>
                    <td class="whitespace-nowrap px-3 py-4 text-sm text-slate-600">

                        </span>

                        ${measure.active_power_w.total}
                    </td>
                `;
                
                tbody.appendChild(tr);
            });
        }

        // Run when DOM is fully loaded
        document.addEventListener('DOMContentLoaded', initDashboard);

</body>
</html>
