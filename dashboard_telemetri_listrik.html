<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring TPS Unesa Lidah Wetan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="bg-blue-800 text-white p-6 text-center">
            <h1 class="text-2xl md:text-3xl font-bold tracking-wider">MONITORING-TPS-UNESA-LIDAH-WETAN</h1>
            <p class="text-blue-200 mt-2">Data Telemetri Kelistrikan</p>
        </div>

        <div class="p-6">
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white border border-gray-200">
                    <thead>
                        <tr class="bg-gray-100 text-gray-700 uppercase text-xs md:text-sm leading-normal">
                            <th class="py-3 px-6 text-left border-b">Waktu (Timestamp)</th>
                            <th class="py-3 px-6 text-center border-b">Tegangan (V)<br><span class="text-xs text-gray-500">A / B / C</span></th>
                            <th class="py-3 px-6 text-center border-b">Arus (A)<br><span class="text-xs text-gray-500">A / B / C</span></th>
                            <th class="py-3 px-6 text-center border-b">Daya Aktif (W)</th>
                            <th class="py-3 px-6 text-center border-b">Frekuensi (Hz)</th>
                            <th class="py-3 px-6 text-center border-b">Power Factor</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="text-gray-600 text-sm font-light">
                        <!-- Data akan dimuat di sini oleh JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Data JSON statis yang Anda berikan sebelumnya dimasukkan langsung ke sini 
        // agar tidak error saat dihosting di GitHub Pages.
        const rawData = [
            {
                "timestamp": "20260922235431",
                "measurement": {
                    "voltage_v": {"a": 232.76, "b": 232.99, "c": 232.84},
                    "current_a": {"a": 0.15, "b": 0.18, "c": 0},
                    "active_power_w": {"total": 0},
                    "frequency_hz": 50.08,
                    "power_factor": {"total": -0.056}
                }
            },
            {
                "timestamp": "20260922233850",
                "measurement": {
                    "voltage_v": {"a": 234.08, "b": 233.76, "c": 233.2},
                    "current_a": {"a": 0.15, "b": 0.18, "c": 0},
                    "active_power_w": {"total": 0},
                    "frequency_hz": 50.07,
                    "power_factor": {"total": -0.06}
                }
            },
            {
                "timestamp": "20260922232350",
                "measurement": {
                    "voltage_v": {"a": 233.65, "b": 233.28, "c": 232.65},
                    "current_a": {"a": 0.15, "b": 0.18, "c": 0},
                    "active_power_w": {"total": 0},
                    "frequency_hz": 50.03,
                    "power_factor": {"total": -0.067}
                }
            },
            {
                "timestamp": "20260922230849",
                "measurement": {
                    "voltage_v": {"a": 233.76, "b": 233.43, "c": 233.12},
                    "current_a": {"a": 0.15, "b": 0.18, "c": 0},
                    "active_power_w": {"total": 0},
                    "frequency_hz": 50,
                    "power_factor": {"total": -0.088}
                }
            },
            {
                "timestamp": "20260922225349",
                "measurement": {
                    "voltage_v": {"a": 231.76, "b": 233.17, "c": 233.01},
                    "current_a": {"a": 0, "b": 0.18, "c": 0},
                    "active_power_w": {"total": 0},
                    "frequency_hz": 49.95,
                    "power_factor": {"total": -0.076}
                }
            }
        ];

        // Fungsi untuk merapikan format waktu (YYYYMMDDHHmmss -> YYYY-MM-DD HH:mm:ss)
        function formatWaktu(ts) {
            if (!ts || ts.length !== 14) return ts;
            return `${ts.substring(0,4)}-${ts.substring(4,6)}-${ts.substring(6,8)} ${ts.substring(8,10)}:${ts.substring(10,12)}:${ts.substring(12,14)}`;
        }

        // Fungsi untuk merender tabel
        function renderTable(dataArray) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = ''; 

            if (!dataArray || dataArray.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="py-4 text-center text-red-500 font-bold">Data tidak ditemukan</td></tr>';
                return;
            }

            dataArray.forEach(item => {
                const m = item.measurement;
                const row = document.createElement('tr');
                row.className = "border-b border-gray-200 hover:bg-gray-100 transition duration-150";

                row.innerHTML = `
                    <td class="py-3 px-6 text-left whitespace-nowrap font-medium">${formatWaktu(item.timestamp)}</td>
                    <td class="py-3 px-6 text-center"><span class="font-bold text-blue-600">${m.voltage_v.a}</span> / <span class="font-bold text-green-600">${m.voltage_v.b}</span> / <span class="font-bold text-red-600">${m.voltage_v.c}</span></td>
                    <td class="py-3 px-6 text-center"><span class="font-bold text-blue-600">${m.current_a.a}</span> / <span class="font-bold text-green-600">${m.current_a.b}</span> / <span class="font-bold text-red-600">${m.current_a.c}</span></td>
                    <td class="py-3 px-6 text-center font-semibold">${m.active_power_w.total}</td>
                    <td class="py-3 px-6 text-center">${m.frequency_hz}</td>
                    <td class="py-3 px-6 text-center">${m.power_factor.total}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // Langsung panggil fungsi render menggunakan data statis agar tampil di GitHub
        renderTable(rawData);

        // =======================================================================
        // CATATAN PENTING JIKA INGIN MENGAMBIL DATA LANGSUNG DARI URL API (LIVE)

                    renderTable(json.data);

            .catch(error => {
                console.error('Error:', error);
                document.getElementById('table-body').innerHTML = '<tr><td colspan="6" class="py-4 text-center text-red-500">Gagal mengambil data dari API (kemungkinan error CORS/HTTPS)</td></tr>';
            });
        */
    </script>
</body>
</html>
